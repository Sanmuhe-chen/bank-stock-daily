// 渲染页面主内容
function switchDate(dateKey){
    const data = dailyData[dateKey];
    if(!data) return;
    document.getElementById("dataDateNote").textContent = "行情数据截至" + data.dataDateNote;
    const wrap = document.getElementById("mainContent");
    let html = "";
    if(data.sign === "休市"){
        html += `<div class="score-card"><strong>${data.dateLabel}</strong>｜休市极简版</div>`;
        html += `<div class="conclusion">${data.conclusion}</div>`;
    }else{
        html += `<div class="score-row">
            <div class="score-card">综合评分：<span class="signal-${data.signClass}">${data.totalScore}</span>｜信号：${data.sign}</div>
            <div class="score-card">板块表现：${data.stats.bankIndex || "-"}</div>
        </div>`;
        html += `<h3>指标评分</h3><table><thead><tr><th>维度</th><th>得分</th><th>权重</th><th>信号</th></tr></thead><tbody>`;
        for(let s of data.scores){
            html += `<tr><td>${s.name}</td><td>${s.score}</td><td>${s.weight}</td><td>${s.sign}</td></tr>`;
        }
        html += `</tbody></table>`;

        html += `<h3>前日对比</h3><table><thead><tr><th>指标</th><th>今日</th><th>前日</th><th>变化</th></tr></thead><tbody>`;
        for(let key in data.compare){
            const c = data.compare[key];
            html += `<tr><td>${key}</td><td>${c.today}</td><td>${c.prev}</td><td>${c.change}</td></tr>`;
        }
        html += `</tbody></table>`;

        for(let d of data.details){
            html += `<div class="dim-title">${d.dim}</div><table><thead><tr><th>指标</th><th>数值</th><th>变动</th><th>信号</th><th>备注</th></tr></thead><tbody>`;
            for(let item of d.items){
                html += `<tr><td>${item.name}</td><td>${item.value}</td><td>${item.change}</td><td>${item.signal}</td><td>${item.note}</td></tr>`;
            }
            html += `</tbody></table>`;
        }

        html += `<h3>当日重要事件</h3>`;
        for(let e of data.events){
            html += `<div class="event-item event-${e.type}"><strong>${e.title}</strong><p>${e.desc}</p></div>`;
        }

        html += `<div class="dim-title">一句话总结</div><p>${data.conclusion}</p>`;

        html += `<h3>明日重点关注</h3><ul class="watch-list">`;
        for(let w of data.watch){
            html += `<li>${w}</li>`;
        }
        html += `</ul>`;

        if(data.attribution){
            html += `<div class="attribution-block">
                <h3>${data.attribution.title}</h3>
                <p>${data.attribution.summary}</p>`;
            for(let dimItem of data.attribution.dims){
                html += `<p><strong>${dimItem.dim}(${dimItem.impact},权重${dimItem.weight})：</strong>${dimItem.desc}</p>`;
            }
            html += `<p><strong>归因小结：</strong>${data.attribution.conclusion}</p>`;
            html += `</div>`;
        }
    }
    wrap.innerHTML = html;
}

// 全量自动渲染日期下拉框，自动排序，仅最新日期添加selected
function renderDateSelect(){
    const dateSelect = document.getElementById("dateSelect");
    const dateArr = Object.keys(dailyData).sort();
    const latestDate = dateArr[dateArr.length - 1];
    let optionHtml = "";
    for(const d of dateArr){
        const item = dailyData[d];
        const selectedStr = d === latestDate ? "selected" : "";
        optionHtml += `<option value="${d}" ${selectedStr}>${item.dateLabel}</option>`;
    }
    dateSelect.innerHTML = optionHtml;
    dateSelect.onchange = function(){
        switchDate(this.value);
    }
}

// 页面初始化
renderDateSelect();
switchDate("2026-10-14");
